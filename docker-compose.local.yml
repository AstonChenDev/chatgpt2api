services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:local
    container_name: chatgpt2api-local
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: sqlite
      DATABASE_URL: sqlite:////app/data/accounts.db
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      # 图片存储环境变量优先于 config.json；值建议保存在同目录、不会被 Git 跟踪的 .env 中。
      CHATGPT2API_IMAGE_STORAGE_ENABLED: ${CHATGPT2API_IMAGE_STORAGE_ENABLED:-}
      CHATGPT2API_IMAGE_STORAGE_MODE: ${CHATGPT2API_IMAGE_STORAGE_MODE:-}
      CHATGPT2API_COS_SECRET_ID: ${CHATGPT2API_COS_SECRET_ID:-}
      CHATGPT2API_COS_SECRET_KEY: ${CHATGPT2API_COS_SECRET_KEY:-}
      CHATGPT2API_COS_REGION: ${CHATGPT2API_COS_REGION:-}
      CHATGPT2API_COS_BUCKET: ${CHATGPT2API_COS_BUCKET:-}
      CHATGPT2API_COS_PATH_PREFIX: ${CHATGPT2API_COS_PATH_PREFIX:-}
      CHATGPT2API_IMAGE_PUBLIC_BASE_URL: ${CHATGPT2API_IMAGE_PUBLIC_BASE_URL:-}
    # 存储后端配置 (可选值: json, sqlite, postgres, git)
    # environment:
    #   STORAGE_BACKEND: json

    # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
    #   DATABASE_URL: postgresql://user:password@host:5432/dbname
    #   DATABASE_URL: sqlite:////app/data/accounts.db

    # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
    #   GIT_REPO_URL: https://github.com/user/repo.git
    #   GIT_TOKEN: ghp_xxxxxxxxxxxx
    #   GIT_BRANCH: main
    #   GIT_FILE_PATH: accounts.json
